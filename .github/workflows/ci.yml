name: Next.js quality gates
on:
  push:
    branches: ["main", "feature/seasonal-juice-store"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:catalog
      - run: npm run test:orders
      - run: npm run test:3d
      - run: npm run test:immersive
      - run: npm run typecheck
      - run: npm run build
